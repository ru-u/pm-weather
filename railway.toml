# Config-as-code for the market logger service (the default service of this repo).
# Cron services reuse the same image and override the start command in the
# Railway dashboard; see docs/deploy.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "pmw log"
restartPolicyType = "ALWAYS"
numReplicas = 1
