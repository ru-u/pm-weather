[project]
name = "pmw"
version = "0.1.0"
description = "Research-grade study of tradable edge in niche weather and energy prediction markets (Kalshi snowfall, ERCOT peak demand)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core = everything the always-on logger needs, and nothing else.
# Keep this list lean: it sets the logger's memory footprint on Railway.
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Laptop-only research stack. Never installed in the logger image.
research = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "properscoring>=0.1",
]
modeling = ["ngboost>=0.5", "xgboost>=2.0", "lightgbm>=4.3"]
weather = ["herbie-data>=2024.8", "xarray>=2024.6", "cfgrib>=0.9.12", "metpy>=1.6"]
energy = ["gridstatus>=0.28"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
pmw = "pmw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmw"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.12"
files = ["src/pmw"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real external APIs (deselected by default; run with -m live)"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # analysis scripts print wide tables
"tests/*" = ["E501"]  # table-shaped fixtures read better on one line
"src/pmw/eval/p2a_score.py" = ["E501"]  # markdown table rows in the report writer
