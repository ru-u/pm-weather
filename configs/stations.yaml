# Settlement station per market series. Never assume the airport: every entry
# says how it was confirmed.
#
# `verified: rules-2025-26` means the station comes from the rule text of that
# series' settled 2025-26 markets, which named the NWS CLI product (e.g. CLINYC)
# and the "Observed Weather" location. This season's rule text points to The
# Weather Company's dashboard and no longer names the CLI product, so each
# mapping must be re-confirmed on https://weather.com/kalshi (see D-004).
#
# std_utc_offset_hours is the STANDARD-time offset. NWS climate days use local
# standard time all year. Coordinates are the ASOS site, approximate to ~100 m;
# confirm against IEM station metadata before any grid-point extraction.
stations:
  KNYC:
    name: New York City, Central Park
    icao: KNYC
    cli_id: KNYC
    cli_product: CLINYC
    wfo: OKX
    lat: 40.7789
    lon: -73.9692
    tz: America/New_York
    std_utc_offset_hours: -5
    series: [KXNYCSNOWM, KXSNOWNYM, SNOWNYM, KXNYCSNOWXMAS]
    verified: rules-2025-26
  KBOS:
    name: Boston, Logan Airport
    icao: KBOS
    cli_id: KBOS
    cli_product: CLIBOS
    wfo: BOX
    lat: 42.3606
    lon: -71.0097
    tz: America/New_York
    std_utc_offset_hours: -5
    series: [KXBOSSNOWM, KXSNOWXMASBOS]
    verified: rules-2025-26
  KDCA:
