repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-secret-files
        name: block key files and .env from being committed
        entry: bash -c 'for f in "$@"; do case "$f" in .env|.env.*|keys*.txt|*.pem|*.key) [ "$f" = ".env.example" ] || { echo "refusing to commit $f"; exit 1; };; esac; done' --
        language: system
        files: '(^|/)(\.env.*|keys.*\.txt|.*\.pem|.*\.key)$'
